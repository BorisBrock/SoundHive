name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml to build the packages for a release
  workflow_call:
    inputs:
      version:
        description: Version to build, taken from the release tag. Without it the version in the repository is used.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Installs the toolchain pinned in rust-toolchain.toml
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      - run: npm ci

      # Releases take their version from the tag, see docs/RELEASING.md
      - name: Set version
        if: inputs.version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: tools/set-version.sh "$VERSION"

      # Portable .exe and .zip, plus the NSIS and MSI installers
      - name: Build and package
        shell: cmd
        run: release.bat --installers

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            .release/*.exe
            .release/*.msi
            .release/*.zip
          if-no-files-found: error
          # .release/ is a dot-directory, which upload-artifact skips by default
          include-hidden-files: true

  linux:
    name: Linux
    # The AppImage and .deb run on distributions with this glibc version or newer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          # The runners' default Ubuntu mirror (azure.archive.ubuntu.com) sometimes stops
          # resolving, and apt then retries it for every package for hours. Use the main archive.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          grep -h '^URIs' /etc/apt/sources.list.d/ubuntu.sources
          # Never prompt, give up on unresponsive servers instead of hanging, and skip IPv6
          # (a dead IPv6 route to the archive makes apt stall).
          export DEBIAN_FRONTEND=noninteractive
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true"
          sudo -E apt-get $APT update
          sudo -E apt-get $APT install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf file

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Installs the toolchain pinned in rust-toolchain.toml
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      - run: npm ci

      # Releases take their version from the tag, see docs/RELEASING.md
      - name: Set version
        if: inputs.version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: tools/set-version.sh "$VERSION"

      # AppImage, .tar.gz and .deb
      - name: Build and package
        env:
          # The runner has no FUSE, so AppImage tools must unpack themselves
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./release.sh --installers

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            .release/*.AppImage
            .release/*.tar.gz
            .release/*.deb
          if-no-files-found: error
          # .release/ is a dot-directory, which upload-artifact skips by default
          include-hidden-files: true
