name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          # The runners' default Ubuntu mirror (azure.archive.ubuntu.com) sometimes stops
          # resolving, and apt then retries it for every package for hours. Use the main archive.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          grep -h '^URIs' /etc/apt/sources.list.d/ubuntu.sources
          # Never prompt, give up on unresponsive servers instead of hanging, and skip IPv6
          # (a dead IPv6 route to the archive makes apt stall).
          export DEBIAN_FRONTEND=noninteractive
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true"
          sudo -E apt-get $APT update
          sudo -E apt-get $APT install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Bindings are up to date
        run: git diff --exit-code src/lib/bindings.ts

      - name: Build app (no installer)
        run: npx tauri build --no-bundle
