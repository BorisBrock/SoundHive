<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2130"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb627" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffb627" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="720">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#f29a0e"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none" stroke="#2c3546" stroke-width="8"/>
  <circle cx="512" cy="512" r="440" fill="url(#glow)"/>
  <!-- a honeycomb cell holding a waveform -->
  <polygon points="840,512 676,796 348,796 184,512 348,228 676,228" fill="#ffb627" fill-opacity="0.08"
           stroke="url(#honey)" stroke-width="44" stroke-linejoin="round"/>
  <g stroke="url(#bars)" stroke-width="44" stroke-linecap="round">
    <line x1="312" y1="472" x2="312" y2="552"/>
    <line x1="392" y1="392" x2="392" y2="632"/>
    <line x1="472" y1="312" x2="472" y2="712"/>
    <line x1="552" y1="362" x2="552" y2="662"/>
    <line x1="632" y1="432" x2="632" y2="592"/>
    <line x1="712" y1="487" x2="712" y2="537"/>
  </g>
</svg>
