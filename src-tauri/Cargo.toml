[package]
name = "soundhive"
version = "0.0.0"
description = "Fast sound effect library browser"
authors = ["Boris Brock"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows issue, see
# https://github.com/rust-lang/cargo/issues/8519).
name = "soundhive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
drag = "2.1"
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2.5"
rayon = "1.12"
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm", "adpcm", "mp3", "ogg", "vorbis", "flac", "aiff", "isomp4", "aac"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac", "symphonia-pcm", "symphonia-adpcm", "symphonia-aiff", "mp4"] }
clipboard-rs = { version = "0.3", default-features = false, features = ["wayland"] }
which = "8"
vorbis_rs = "0.5"
flacenc = { version = "0.5", default-features = false }

[dev-dependencies]
tempfile = "3"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Audio decoding is painfully slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3
